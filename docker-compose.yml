services:
  sentinelx:
    build: .
    container_name: sentinelx
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/data/sentinelx.db
      SEED_DEMO_DATA: "true"
      APP_ENV: docker
    volumes:
      - sentinelx-data:/app/data
    restart: unless-stopped

  # Optional shared rate-limit/cache store. The API falls back to in-process
  # caching when Redis is not deployed.
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    container_name: sentinelx-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # Optional: run `docker compose --profile postgres up` to use PostgreSQL.
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    container_name: sentinelx-postgres
    environment:
      POSTGRES_DB: sentinelx
      POSTGRES_USER: sentinelx
      POSTGRES_PASSWORD: sentinelx
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Optional: run `docker compose --profile elastic up` for advanced log search.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    profiles: ["elastic"]
    container_name: sentinelx-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data

volumes:
  sentinelx-data:
  postgres-data:
  redis-data:
  elastic-data:
